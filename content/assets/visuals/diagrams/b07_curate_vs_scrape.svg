<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect x="0" y="0" width="1200" height="760" rx="0" fill="#ffffff"/>
<text x="80" y="66" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e8453c" text-anchor="start" letter-spacing="2.5">WHY CURATION</text>
<text x="80" y="116" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="46" font-weight="400" fill="#111111" text-anchor="start">Curated, not scraped</text>
<rect x="80" y="200" width="460" height="360" rx="2" fill="#f6f5f3" stroke="#d9d8d4" stroke-width="1.5"/>
<text x="110" y="256" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#111111" text-anchor="start">Web scraping</text>
<text x="110" y="320" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6b6b66" text-anchor="start">×  Open-web noise</text>
<text x="110" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6b6b66" text-anchor="start">×  SEO spam</text>
<text x="110" y="428" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6b6b66" text-anchor="start">×  Unverifiable claims</text>
<text x="110" y="482" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6b6b66" text-anchor="start">×  Nothing to cite</text>
<rect x="660" y="200" width="460" height="360" rx="2" fill="#ffffff" stroke="#e8453c" stroke-width="2"/>
<text x="690" y="256" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#e8453c" text-anchor="start">Curated sources</text>
<text x="690" y="320" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#111111" text-anchor="start">—  Credible documents</text>
<text x="690" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#111111" text-anchor="start">—  Government data</text>
<text x="690" y="428" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#111111" text-anchor="start">—  Live news feeds</text>
<text x="690" y="482" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#111111" text-anchor="start">—  Every claim traceable</text>
<text x="600.0" y="530" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="middle">Defensible, because it is sourced.</text>
<line x1="80" y1="688" x2="1120" y2="688" stroke="#d9d8d4" stroke-width="1.5"/>
<text x="80" y="714" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#111111" text-anchor="start">Caspr</text>
<circle cx="158" cy="706" r="5" fill="#e8453c"/>
<text x="1120" y="714" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b6b66" text-anchor="end">caspr.ai</text>
</svg>