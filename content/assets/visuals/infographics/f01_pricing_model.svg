<text x="96" y="196" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" fill="#ffffff" text-anchor="start" style="">How Caspr pricing works</text>
<text x="96" y="426" font-family="'DM Mono', Menlo, Consolas, monospace" font-size="40" font-weight="400" fill="#e8453c" text-anchor="start" style="">01</text>
<text x="186" y="420" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="36" font-weight="400" fill="#111111" text-anchor="start" style="">Your Research Budget</text>
<text x="186" y="460" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#6b6b66" text-anchor="start" style="">A monthly amount you control — like a research retainer.</text>
<line x1="114" y1="484" x2="114" y2="544" stroke="#e5e4e1" stroke-width="1"/>
<text x="96" y="566" font-family="'DM Mono', Menlo, Consolas, monospace" font-size="40" font-weight="400" fill="#e8453c" text-anchor="start" style="">02</text>
<text x="186" y="560" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="36" font-weight="400" fill="#111111" text-anchor="start" style="">Draw analyses from it</text>
<text x="186" y="600" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#6b6b66" text-anchor="start" style="">Each analysis has a fixed price. Run what you need.</text>
<line x1="114" y1="624" x2="114" y2="684" stroke="#e5e4e1" stroke-width="1"/>
<text x="96" y="706" font-family="'DM Mono', Menlo, Consolas, monospace" font-size="40" font-weight="400" fill="#e8453c" text-anchor="start" style="">03</text>
<text x="186" y="700" font-family="Instrument Serif, Georgia, 'Times New Roman', serif" font-size="36" font-weight="400" fill="#111111" text-anchor="start" style="">Unused balance carries forward</text>
<text x="186" y="740" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#6b6b66" text-anchor="start" style="">You never lose what you didn't spend.</text>
